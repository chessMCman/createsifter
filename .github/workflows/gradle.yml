name: CreateSifting

on:
  push:
    tags:
      - '2.3.1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04 # 固定系统版本，避免 ubuntu-latest 迁移带来的不稳定

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # 升级到 v5，解决 Node.js 20 弃用警告

      - name: Set up JDK 21
        uses: actions/setup-java@v5 # 升级到 v5，解决 v4 弃用警告
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # 直接使用 v4，避免写死哈希值

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace # 加上 --stacktrace，失败时打印具体报错

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
