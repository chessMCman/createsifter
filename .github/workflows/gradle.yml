name: Build and Release Minecraft Mod

on:
  push:
    tags:
      - 'v*' # 只有当你推送 v1.0.0 这样的 tag 时才触发编译和发布
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行

permissions:
  contents: write # 必须授权写入权限，否则无法创建 Release 和上传 JAR

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 21 (Minecraft 1.21.1 需要 Java 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 设置 Gradle 并启用缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # 4. 赋予 gradlew 执行权限并编译
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # 5. 创建 GitHub Release 并上传 JAR
      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar # 上传构建产物
          generate_release_notes: true # 自动根据 commit 生成发布说明
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
